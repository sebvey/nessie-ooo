[project]
name = "ingestion"
version = "0.1.0"
description = "Synthetic source data: raw orders appended to a Nessie branch"
requires-python = ">=3.13"
dependencies = [
    "lakehouse-client",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
]

[project.scripts]
ingest = "ingestion.ingest:main"

[tool.uv.sources]
lakehouse-client = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
