nessie_demo:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Local DuckDB database: holds the staging views. The Iceberg catalog only stores tables
      # (DuckDB's Iceberg extension can't create views in it).
      # Absolute (mise exports DBT_PROJECT_DIR): dbt can run from the repo root or from dbt/.
      path: "{{ env_var('DBT_PROJECT_DIR', 'dbt') }}/target/nessie_demo.duckdb"
      extensions:
        - httpfs
        - iceberg
      settings:
        # Without it, any write after a table creation fails
        # ("table metadata does not contain a metadata-log").
        iceberg_use_metadata_log: false
      # Access to the Iceberg data files in Silo.
      secrets:
        - type: s3
          # From the environment (mise.toml, mise.local.toml): dbt fails if one is missing.
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
          # DuckDB wants host:port, without the scheme.
          endpoint: "{{ env_var('AWS_ENDPOINT_URL') | replace('http://', '') }}"
          url_style: path
          use_ssl: false
          region: "{{ env_var('AWS_REGION') }}"
      # The Nessie catalog, attached as the `lake` database. The branch is in the endpoint: every
      # read and write targets it, never main directly.
      attach:
        - path: warehouse
          alias: lake
          type: iceberg
          options:
            endpoint: "{{ env_var('NESSIE_URI') }}/iceberg/{{ env_var('NESSIE_BRANCH', 'main') }}"
            authorization_type: none
