[tools]
uv = "latest"

[env]
# dbt: the project and its profiles live in dbt/ (overrides the workspace's DBT_PROFILES_DIR).
DBT_PROJECT_DIR = "{{config_root}}/dbt"
DBT_PROFILES_DIR = "{{config_root}}/dbt"

# Nessie as reached from the host: API v2 at /api/v2, Iceberg REST at /iceberg/<branch>.
NESSIE_URI = "http://localhost:19120"

# Local Silo, for the demo's clients, dbt and the AWS CLI (e.g. `aws s3 ls s3://iceberg-warehouse --recursive`).
# The credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) are secrets: they live in mise.local.toml.
AWS_ENDPOINT_URL = "http://localhost:29000"
AWS_REGION = "us-east-1"
AWS_S3_ADDRESSING_STYLE = "path"
AWS_EC2_METADATA_DISABLED = "true"

# Keeps pipeline / dbt logs in order when the output is redirected.
PYTHONUNBUFFERED = "1"

[task_config]
# The demo tasks live in tasks.toml.
includes = ["tasks.toml"]
