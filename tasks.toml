# Demo tasks, loaded by mise.toml ([task_config] includes). List them with `mise tasks`.

[stack-up]
description = "Start the stack (Nessie + Postgres + Silo) and create the raw / marts namespaces on main"
# `uv run` installs the Python deps if needed (--quiet: without the package list).
run = "uv run --quiet bootstrap"
quiet = true

[stack-down]
description = "Stop the stack (keep the volumes)"
run = "docker compose down"

[stack-reset]
description = "Stop the stack and delete everything (Nessie history + Silo objects)"
run = "docker compose down -v"

[pipeline-ok]
description = "Nominal pipeline: branch -> ingest -> dbt build -> merge + tag on main"
run = "uv run pipeline"
raw = true    # stdin wired to the terminal: pauses between steps (Enter)
quiet = true  # no "[pipeline-ok] $ uv run pipeline" line

[pipeline-ko]
description = "Failing pipeline: bad data -> red tests -> no merge + alert"
# The pipeline exits with an error on purpose (a real CI run would fail here): swallow it so the
# demo ends cleanly on the alert banner.
run = "uv run pipeline --bad || true"
raw = true
quiet = true

[branches]
description = "List Nessie branches and tags"
run = "curl -s http://localhost:19120/api/v2/trees | python3 -m json.tool"

[cli]
description = "Nessie REPL connected to main (e.g. LIST REFERENCES;). Args go to the CLI, e.g. -c 'SHOW LOG;'"
run = "docker compose run --rm --no-deps nessie-cli -u http://nessie:19120/api/v2 -r main"

[notebook]
description = "marimo notebook: pick a branch, browse the tables, query them with DuckDB"
run = "uv run --group explore marimo edit notebooks/explore.mo.py"

[dbt-inspect]
description = "Replay dbt build on a branch, e.g. mise run dbt-inspect pipeline-120000-bad"
usage = 'arg "<branch>" help="Nessie branch to inspect"'
run = "NESSIE_BRANCH=${usage_branch?} uv run dbt build || true"

[audit-python]
description = "Audit the locked Python dependencies for known vulnerabilities (OSV). Container images are not audited (T011)"
# Exported with hashes so pip-audit checks exactly the locked files; the export goes to a temporary
# directory, removed on exit. pip-audit exits non-zero when it finds a vulnerability. With OSV it
# warns that hashes are only checked for presence: harmless here, uv checks them at install.
quiet = true
run = '''
set -e
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
uv export --frozen --no-emit-project --all-groups --quiet -o "$tmp/requirements.txt"
uvx pip-audit --disable-pip --require-hashes --vulnerability-service osv -r "$tmp/requirements.txt"
'''
