# Fixed project name: the containers and volumes keep their names wherever the file lives.
name: nessie-ooo

services:

  nessie:
    image: ghcr.io/projectnessie/nessie:0.106.0
    container_name: nessie
    ports:
    - "19120:19120" # Nessie API
    - "19000:9000" # Management port (metrics and health checks) - container 9000 -> host 19000
    depends_on:
      postgres:
        condition: service_healthy
      silo-setup:
        condition: service_completed_successfully
    environment:
      # Version store -> JDBC2 on Postgres, through the Quarkus datasource named "postgresql"
      - nessie.version.store.type=JDBC2
      - nessie.version.store.persist.jdbc.datasource=postgresql
      - quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://postgres:5432/nessie
      - quarkus.datasource.postgresql.username=${NESSIE_PG_USER:?set in mise.local.toml, run through mise}
      - quarkus.datasource.postgresql.password=${NESSIE_PG_PASSWORD:?set in mise.local.toml, run through mise}
      # Authentication Settings - disabled -> everyone can access nessie
      - nessie.server.authentication.enabled=false
      # Authorization Settings -> disabled -> all rights on nessie namespaces
      - nessie.server.authorization.enabled=false
      ## Object Store Settings (warehouse) -> Silo
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://iceberg-warehouse/
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=${AWS_ACCESS_KEY_ID:?set in mise.local.toml, run through mise}
      - nessie.catalog.secrets.access-key.secret=${AWS_SECRET_ACCESS_KEY:?set in mise.local.toml, run through mise}
        # Silo endpoint for the Nessie server
      - nessie.catalog.service.s3.default-options.endpoint=http://silo:9000/
        # Silo endpoint for clients (on the Docker host)
      - nessie.catalog.service.s3.default-options.external-endpoint=${AWS_ENDPOINT_URL:?set in mise.toml, run through mise}/
    healthcheck:
      # healthcheck is executed from within the container’s own network namespace
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /q/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:15.19
    container_name: nessie-postgres
    environment:
      - POSTGRES_DB=nessie
      - POSTGRES_USER=${NESSIE_PG_USER:?set in mise.local.toml, run through mise}
      - POSTGRES_PASSWORD=${NESSIE_PG_PASSWORD:?set in mise.local.toml, run through mise}
    ports:
      - "35432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  silo:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z  # Silo, pgsty's community fork of MinIO: MinIO's official images are no longer published
    container_name: silo
    # S3 API on the default port 9000; console moved from its default 9001 to 9090.
    command: server /data --console-address :9090
    ports:
    # API port
    - "29000:9000"
    # Silo console
    - "29090:9090"
    volumes:
    - silo_data:/data
    environment:
      # Silo keeps MinIO's variable names: there is no SILO_* equivalent.
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:?set in mise.local.toml, run through mise}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:?set in mise.local.toml, run through mise}
    healthcheck:
      # Probes the liveness endpoint on 127.0.0.1:9000, exit code 0 when healthy.
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 5s
      timeout: 2s
      retries: 15

  # One-shot: create the Iceberg warehouse bucket, then exit. Uses the mcli client shipped in the Silo image.
  silo-setup:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?set in mise.local.toml, run through mise}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?set in mise.local.toml, run through mise}
    # $$: expanded by the container's shell, not by compose.
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://silo:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY &&
      mcli mb -p local/iceberg-warehouse &&
      echo 'bucket iceberg-warehouse ready'
      "

  # Nessie CLI (REPL), started on demand: `mise run cli`. On the compose network, so it reaches
  # Nessie by its service name (no need for --network host).
  nessie-cli:
    image: ghcr.io/projectnessie/nessie-cli:0.106.0
    profiles: [tools]
    depends_on:
      nessie:
        condition: service_healthy

volumes:
  silo_data:
  postgres_data:
