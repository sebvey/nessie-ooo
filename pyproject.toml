[project]
name = "nessie-demo"
version = "0.1.0"
description = "Nessie + Iceberg + dbt (DuckDB) branch->test->merge demo"
readme = "README.md"
requires-python = ">=3.13"
# The whole demo: every component, so `uv run <command>` works from anywhere in the repository.
# Each component declares its own dependencies in its pyproject.toml.
dependencies = [
    "exploration",
    "ingestion",
    "lakehouse-client",
    "orchestration",
    "stack",
    "transformation",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "exploration",
    "ingestion",
    "lakehouse-client",
    "orchestration",
    "stack",
    "transformation",
]

[tool.uv.sources]
exploration = { workspace = true }
ingestion = { workspace = true }
lakehouse-client = { workspace = true }
orchestration = { workspace = true }
stack = { workspace = true }
transformation = { workspace = true }
