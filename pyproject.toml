[project]
name = "nessie-demo"
version = "0.1.0"
description = "Nessie + Iceberg + dbt (DuckDB) branch->test->merge demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=2.0.0.dev2610151406",
    "numpy>=2.5.4",
    "pyarrow>=24.0.0",
    "pyiceberg[s3fs,pyarrow]>=0.12.0",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
ingest = "nessie_demo.ingest:main"
pipeline = "nessie_demo.pipeline:main"
bootstrap = "nessie_demo.bootstrap:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
explore = [
    "marimo[sql]>=0.25.1",
]
