[project]
name = "nessie-ooo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.3",
    "marimo[sql]>=0.18.4",
    "polars[pyarrow]>=1.36.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyiceberg[s3fs,pyiceberg-core]>=0.10.0",
    "pyspark>=3.5,<3.6",
    "ruff>=0.14.10",
]

[project.scripts]
ingest_taxi_dataset = "nessie_ooo.ingestion.taxi_dataset:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
