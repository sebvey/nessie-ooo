[project]
name = "lakehouse-client"
version = "0.1.0"
description = "Access to the lakehouse through a Nessie branch: Nessie API, PyIceberg catalog, DuckDB, settings"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0.dev2610151406",
    "pyarrow>=26.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.16.0",
    "pyiceberg[s3fs,pyarrow]>=0.12.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
