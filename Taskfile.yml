version: "3"

vars:
  DBT_FLAGS: --project-dir dbt --profiles-dir dbt

tasks:
  up:
    desc: Start the stack (Nessie + Postgres + MinIO) and install python deps
    cmds:
      - docker compose up -d
      - uv sync
      - 'echo "Nessie: http://localhost:19120   MinIO console: http://localhost:29090 (minioadmin/minioadmin)"'

  down:
    desc: Stop the stack (keep volumes)
    cmds:
      - docker compose down

  reset:
    desc: Stop the stack and wipe all data (Nessie history + MinIO objects)
    cmds:
      - docker compose down -v

  run:
    desc: Run the happy-path pipeline (branch -> ingest -> dbt build -> merge to main)
    cmds:
      - uv run pipeline

  fail:
    desc: Run the failure-path pipeline (bad data -> tests fail -> NO merge + alert)
    # The pipeline exits non-zero on purpose (a real CI would fail here); we swallow it
    # so the demo output ends cleanly on the alert banner.
    ignore_error: true
    cmds:
      - uv run pipeline --bad

  branches:
    desc: List Nessie branches
    cmds:
      - 'curl -s http://localhost:19120/api/v2/trees | python3 -m json.tool'

  nessie-cli:
    desc: Open the Nessie CLI (REPL) connected to main (try LIST REFERENCES;)
    cmds:
      - docker run --rm -it --network host ghcr.io/projectnessie/nessie-cli:0.106.0 -u http://localhost:19120/api/v2 -r main

  notebook:
    desc: Launch the marimo data explorer (pick a branch, browse tables, query with DuckDB)
    cmds:
      - uv run --group explore marimo edit notebooks/explore.mo.py

  dbt-inspect:
    desc: 'Open dbt against a branch for inspection, e.g. task dbt-inspect -- <branch>'
    ignore_error: true
    cmds:
      - NESSIE_BRANCH={{.CLI_ARGS}} uv run dbt build {{.DBT_FLAGS}}
